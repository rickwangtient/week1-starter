<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Advanced JavaScript Mapping{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Leaflet Draw CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <!-- Custom CSS -->
    <style>
        body {
            background: #ccccff;
            color: #333333;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar {
            background: #003366 !important;
            border-bottom: 1px solid #000033;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
        }

        .navbar-nav .nav-link {
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .navbar-nav .nav-link:hover {
            color: #ffff99 !important;
            transform: translateY(-1px);
        }

        .container-fluid {
            padding: 2rem;
        }

        .card {
            background: #ffffff;
            border: 1px solid #9999cc;
            border-radius: 15px;
            box-shadow: 0 8px 16px #9999cc;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px #666699;
        }

        .btn {
            border-radius: 25px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 10px #9999cc;
        }

        .map-container {
            height: 70vh;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px #9999cc;
        }

        .results-panel {
            max-height: 70vh;
            overflow-y: auto;
        }

        .city-card {
            margin-bottom: 1rem;
            transition: all 0.3s ease;
        }

        .city-card:hover {
            transform: scale(1.02);
        }

        .loading {
            text-align: center;
            padding: 2rem;
        }

        .spinner-border {
            color: #003399;
        }

        .alert {
            border-radius: 15px;
        }

        .badge {
            border-radius: 10px;
            font-size: 0.8rem;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container-fluid {
                padding: 1rem;
            }

            .map-container {
                height: 50vh;
            }

            .results-panel {
                max-height: 40vh;
                margin-top: 1rem;
            }
        }

        /* Custom scrollbar */
        .results-panel::-webkit-scrollbar {
            width: 6px;
        }

        .results-panel::-webkit-scrollbar-track {
            background: #ffffff;
            border-radius: 10px;
        }

        .results-panel::-webkit-scrollbar-thumb {
            background: #9999cc;
            border-radius: 10px;
        }

        .results-panel::-webkit-scrollbar-thumb:hover {
            background: #666699;
        }

        a, .text-primary {
            color: #003399 !important;
        }

        .text-muted {
            color: #666666 !important;
        }

        .btn-primary, .bg-primary {
            color: #ffffff !important;
            background-color: #003399 !important;
            border-color: #003399 !important;
        }

        .btn-outline-primary {
            color: #003399;
            border-color: #003399;
        }

        .btn-outline-secondary {
            color: #333333;
            border-color: #666666;
        }

        .btn-outline-success {
            color: #006633;
            border-color: #006633;
        }

        .btn-outline-primary:hover, .btn-outline-primary:focus {
            color: #ffffff;
            background-color: #003399;
            border-color: #003399;
        }

        .btn-primary:hover, .btn-primary:focus {
            background-color: #000066 !important;
            border-color: #000066 !important;
        }

        .btn-outline-secondary:hover, .btn-outline-secondary:focus {
            color: #ffffff;
            background-color: #333333;
            border-color: #333333;
        }

        .btn-outline-success:hover, .btn-outline-success:focus {
            color: #ffffff;
            background-color: #006633;
            border-color: #006633;
        }

        .bg-secondary { background-color: #666666 !important; color: #ffffff; }
        .bg-success { background-color: #006633 !important; color: #ffffff; }
        .bg-danger { background-color: #990000 !important; color: #ffffff; }
        .bg-warning { background-color: #ffcc00 !important; color: #333333; }
        .bg-info { background-color: #99ccff !important; color: #333333; }
        .bg-light { background-color: #ffffff !important; }
        .text-dark { color: #333333 !important; }

        .alert-info {
            color: #003366;
            background-color: #ccffff;
            border-color: #669999;
        }

        .alert-success {
            color: #003300;
            background-color: #ccffcc;
            border-color: #669966;
        }

        .alert-danger {
            color: #660000;
            background-color: #ffcccc;
            border-color: #cc6666;
        }

        .table {
            color: #333333;
            border-color: #cccccc;
        }
    </style>

    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="{% url 'advanced_js_mapping:index' %}">
                <i class="fas fa-globe-europe me-2"></i>
                Advanced JS Mapping
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'advanced_js_mapping:index' %}">
                            <i class="fas fa-home me-1"></i>
                            Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'advanced_js_mapping:map' %}">
                            <i class="fas fa-map me-1"></i>
                            Interactive Map
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="{% url 'advanced_js_mapping:analytics' %}">
                            <i class="fas fa-chart-bar me-1"></i>
                            Analytics
                        </a>
                    </li>
                </ul>

                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle text-white" href="#" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-cog me-1"></i>
                            API
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="{% url 'advanced_js_mapping:cities_api' %}" target="_blank">Cities API</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="showApiDocs()">API Documentation</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    <script>
        // Utility functions
        function showApiDocs() {
            alert('API Documentation:\n\n' +
                  'POST /advanced-js-mapping/api/polygon-search/\n' +
                  'GET /advanced-js-mapping/api/cities/\n' +
                  'POST /advanced-js-mapping/api/distance-search/\n\n' +
                  'See the tutorial for detailed usage examples.');
        }

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Global error handling
        window.addEventListener('error', function(e) {
            console.error('JavaScript error:', e.error);
        });

        window.addEventListener('unhandledrejection', function(e) {
            console.error('Unhandled promise rejection:', e.reason);
        });
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
